<title>Docu Studio (GitHub)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one working column; a top bar with three views (Trends, Write, Projects). Same warm-dark + gold world as the videos. */
:root {
  --bg: #f6f2ea; --panel: #fffdf8; --line: #ded5c4; --fg: #1d1a16; --dim: #6c6457; --gold: #a8741a; --gold-bg: #f4e6c8;
  --ok: #2f7a45; --warn: #a3620b; --bad: #b23b2a;
  --display: "Spectral", Georgia, serif; --body: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #12100d; --panel: #1b1814; --line: #332d25; --fg: #efe8dc; --dim: #a39886; --gold: #e0b04a; --gold-bg: #3a2e17; --ok: #6cc289; --warn: #e5a64a; --bad: #ef7c69; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #12100d; --panel: #1b1814; --line: #332d25; --fg: #efe8dc; --dim: #a39886; --gold: #e0b04a; --gold-bg: #3a2e17; --ok: #6cc289; --warn: #e5a64a; --bad: #ef7c69; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--body); }
.wrap { max-width: 980px; margin: 0 auto; padding-block: 18px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 10px; }
h1 { font: 700 30px/1.1 var(--display); margin: 0; letter-spacing: -0.01em; }
h1 small { font: 500 13px var(--body); color: var(--dim); letter-spacing: 0.06em; text-transform: uppercase; margin-left: 8px; }
h2 { font: 700 22px/1.2 var(--display); margin: 0; text-wrap: balance; }
h3 { font: 600 15px var(--body); margin: 0; }
nav { display: flex; gap: 6px; flex-wrap: wrap; }
nav button, .btn { font: 600 14px var(--body); border: 1px solid var(--line); background: var(--panel); color: var(--fg); padding: 8px 14px; border-radius: 8px; cursor: pointer; }
nav button[aria-current="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn.primary { background: var(--gold); border-color: var(--gold); color: #fff; }
:root:not([data-theme="light"]) .btn.primary { color: #1b1408; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn:focus-visible, nav button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 12px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
label { display: grid; gap: 4px; font-size: 13px; color: var(--dim); font-weight: 500; }
input, select, textarea { font: 15px var(--body); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; box-sizing: border-box; }
textarea { min-height: 70px; resize: vertical; line-height: 1.5; }
textarea.code { font: 12.5px/1.45 var(--mono); min-height: 60px; }
.dim { color: var(--dim); }
.note { font-size: 13px; color: var(--dim); }
.pill { font: 600 12px var(--body); letter-spacing: 0.04em; text-transform: uppercase; padding: 3px 9px; border-radius: 99px; background: var(--gold-bg); color: var(--gold); white-space: nowrap; }
.pill.ok { background: transparent; color: var(--ok); border: 1px solid var(--ok); }
.pill.bad { background: transparent; color: var(--bad); border: 1px solid var(--bad); }
.pill.warn { background: transparent; color: var(--warn); border: 1px solid var(--warn); }
.topic { display: grid; gap: 6px; padding: 14px 0; border-top: 1px solid var(--line); }
.topic:first-of-type { border-top: 0; }
.topic a { color: var(--gold); }
.chapter { display: grid; gap: 10px; }
.chapter > h3 { font: 700 18px var(--display); color: var(--gold); }
.scene { display: grid; grid-template-columns: 1fr; gap: 6px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.scene .meta { display: flex; justify-content: space-between; gap: 8px; font: 12px var(--mono); color: var(--dim); flex-wrap: wrap; }
.read { font: 19px/1.7 var(--display); max-width: 65ch; white-space: pre-wrap; }
.read b { color: var(--gold); }
.proj { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.proj:first-child { border-top: 0; }
.proj .t { font: 600 16px var(--body); }
.steps { display: grid; gap: 10px; counter-reset: step; }
.claims { list-style: none; margin: 8px 0 0; padding: 0; }
.claim { display: grid; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); }
.step { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; }
.step::before { counter-increment: step; content: counter(step); width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 600 13px var(--body); background: var(--gold-bg); color: var(--gold); }
.step.done::before { content: "✓"; background: var(--ok); color: var(--bg); }
.step > div { display: grid; gap: 8px; min-width: 0; }
video { width: 100%; max-width: 100%; border-radius: 10px; background: #000; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; } .bar > i { display: block; height: 100%; background: var(--gold); width: 0; }
.empty { padding: 26px; text-align: center; color: var(--dim); border: 1px dashed var(--line); border-radius: 12px; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.thumbs figure { margin: 0; display: grid; gap: 6px; }
.thumbs img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
pre.desc { font: 12.5px/1.5 var(--mono); white-space: pre-wrap; margin: 0; max-height: 220px; overflow: auto; background: var(--bg); padding: 10px; border-radius: 8px; border: 1px solid var(--line); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <h1>Docu Studio <small>PnoyChess long-form</small></h1>
    <nav aria-label="Views">
      <button type="button" id="nav-trends" data-view="trends">Trends</button>
      <button type="button" id="nav-write" data-view="write">Write</button>
      <button type="button" id="nav-projects" data-view="projects">Projects</button>
      <button type="button" id="nav-music" data-view="music">Music</button>
    </nav>
  </header>
  <div id="status" class="note" role="status"></div>
  <main id="view"></main>
</div>

<script>
// Docu Studio on GitHub Pages: the same studio/index.html, with GitHub in place of Claude's database and storage.
// tools/build-site.mjs puts this script in front of the page (site/index.html), so the page finds a window.claude
// that keeps every document as db/<collection>/<id>.json and every upload as db/files/<id> in the pnoychess-docu
// repo. Writing needs Claude and is simply not offered here (the page already works without it).
// The access key is a fine-grained GitHub token for that one repo, kept only in this browser (as the reel Inbox does).
// makeBackend() has no browser parts, so tests/run.mjs tests it against tests/fake-github.mjs.
(function () {
  const REPO = "mboylesm-wq/pnoychess-docu", BRANCH = "main", KEY = "docu.github.key", POLL = 30000;
  const SAFE = /^[A-Za-z0-9][A-Za-z0-9._-]{0,120}$/;

  const toB64 = (bytes) => { let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); };
  const fromB64 = (b64) => Uint8Array.from(atob(String(b64).replace(/\s/g, "")), (c) => c.charCodeAt(0));
  const textB64 = (t) => toB64(new TextEncoder().encode(t));
  const clone = (x) => JSON.parse(JSON.stringify(x));

  function makeBackend({ fetch, token, repo = REPO, branch = BRANCH, api = "https://api.github.com", onAuthError = () => {} }) {
    const base = `${api}/repos/${repo}`;
    async function call(path, { method = "GET", body, accept = "application/vnd.github+json", etag } = {}) {
      const headers = { Authorization: "Bearer " + token, Accept: accept, "X-GitHub-Api-Version": "2022-11-28" };
      if (body !== undefined) headers["Content-Type"] = "application/json";
      if (etag) headers["If-None-Match"] = etag;
      const r = await fetch(base + path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body), cache: "no-store" });
      if (r.status === 401) onAuthError();
      return r;
    }
    async function json(path, opts) {
      const r = await call(path, opts);
      if (r.status === 304) return { notModified: true };
      if (!r.ok) { const e = new Error(`GitHub ${r.status}: ${(await r.text()).slice(0, 200)}`); e.status = r.status; throw e; }
      return r.status === 204 ? null : { body: await r.json(), etag: r.headers.get("etag") };
    }
    const docPath = (key) => { const [coll, id, extra] = String(key).split("/"); if (!/^[a-z]+$/.test(coll || "") || !SAFE.test(id || "") || extra !== undefined) throw new Error("not a document: " + key); return { coll, id, path: `db/${coll}/${id}.json` }; };
    const ref = `?ref=${encodeURIComponent(branch)}`;

    // ---- documents: a read before every write, so a save never overwrites what someone else saved meanwhile
    async function readDoc(path) {
      let got; try { got = (await json(`/contents/${path}${ref}`)).body; } catch (e) { if (e.status === 404) return null; throw e; }
      if (got.content) return { sha: got.sha, data: JSON.parse(new TextDecoder().decode(fromB64(got.content))) };
      const raw = await call(`/contents/${path}${ref}`, { accept: "application/vnd.github.raw" }); // over 1 MB
      if (!raw.ok) throw new Error(`GitHub ${raw.status} reading ${path}`);
      return { sha: got.sha, data: JSON.parse(await raw.text()) };
    }
    async function writeDoc(path, data, sha, what) {
      const body = { message: `studio: ${what}`, content: textB64(JSON.stringify(data, null, 1) + "\n"), branch, ...(sha ? { sha } : {}) };
      return (await json(`/contents/${path}`, { method: "PUT", body })).body.content.sha;
    }
    // GitHub refuses a write whose sha is stale (409) or missing (422): read again and redo it
    const stale = (e) => e && (e.status === 409 || e.status === 422);
    const queues = new Map(), serial = (k, fn) => { const p = (queues.get(k) || Promise.resolve()).then(fn, fn); queues.set(k, p.catch(() => {})); return p; };
    async function retry(fn) { for (let i = 0; ; i++) { try { return await fn(); } catch (e) { if (!stale(e) || i >= 4) throw e; } } }

    // ---- collections: the folder listing, polled, and each changed file read once by its sha
    const colls = new Map();
    const collOf = (name) => { if (!colls.has(name)) colls.set(name, { files: new Map(), gone: new Map(), etag: null, subs: new Set(), loaded: false }); return colls.get(name); };
    const snapshot = (c, q) => {
      let docs = [...c.files].map(([id, f]) => ({ id, data: () => clone(f.data), _d: f.data }));
      if (q.order) { const [f, dir] = q.order; docs.sort((a, b) => String(a._d[f] ?? "").localeCompare(String(b._d[f] ?? "")) * (dir === "desc" ? -1 : 1)); }
      if (q.max) docs = docs.slice(0, q.max);
      return { docs: docs.map(({ id, data }) => ({ id, data })) };
    };
    const notify = (name) => { const c = collOf(name); c.subs.forEach((s) => { try { s.fn(snapshot(c, s.q)); } catch (e) { /* a listener's own error */ } }); };
    async function refresh(name) {
      const c = collOf(name);
      const list1 = async (etag) => { try { return await json(`/contents/db/${name}${ref}`, { etag }); } catch (e) { if (e.status !== 404) throw e; return { body: [], etag: null }; } };
      let list = await list1(c.etag);
      if (list.notModified && c.loaded) return;
      if (list.notModified) list = await list1(null); // nothing shown yet: a 304 has no folder to show
      if (!Array.isArray(list.body)) throw new Error(`GitHub sent no listing for db/${name}`);
      const seen = new Set(), now = Date.now(); let pinned = false;
      for (const f of list.body) {
        if (f.type !== "file" || !f.name.endsWith(".json")) continue;
        const id = f.name.slice(0, -5), cur = c.files.get(id); seen.add(id);
        if (cur && cur.sha === f.sha) continue;
        // GitHub's listing can lag a few seconds behind a write: this page's own saves and deletes win for a minute
        if ((cur && cur.own && now - cur.own < 60000) || (c.gone.has(id) && now - c.gone.get(id) < 60000)) { pinned = true; continue; }
        const blob = (await json(`/git/blobs/${f.sha}`)).body;
        try { c.files.set(id, { sha: f.sha, data: JSON.parse(new TextDecoder().decode(fromB64(blob.content))) }); } catch (e) { /* not JSON: skipped */ }
      }
      for (const id of [...c.files.keys()]) { const f = c.files.get(id); if (seen.has(id)) continue; if (f.own && now - f.own < 60000) { pinned = true; continue; } c.files.delete(id); }
      // only a listing read in full counts as seen: a skipped entry or a failed read is looked at again next poll
      c.etag = pinned ? null : list.etag;
      c.loaded = true; notify(name);
    }
    const refreshAll = () => Promise.all([...colls].filter(([, c]) => c.subs.size).map(([n]) => refresh(n).catch(() => {})));
    const remember = (coll, id, sha, data) => { const c = collOf(coll); if (data) { c.files.set(id, { sha, data, own: Date.now() }); c.gone.delete(id); } else { c.files.delete(id); c.gone.set(id, Date.now()); } c.etag = null; notify(coll); };

    const query = (name, q = {}) => ({
      orderBy: (f, dir = "asc") => query(name, { ...q, order: [f, dir] }),
      limit: (n) => query(name, { ...q, max: n }),
      onSnapshot(fn, err) {
        const c = collOf(name), s = { fn, q }; c.subs.add(s);
        if (c.loaded) setTimeout(() => fn(snapshot(c, q))); else refresh(name).catch((e) => err && err(e));
        return () => c.subs.delete(s);
      },
    });
    const db = {
      collection: (name) => { if (!/^[a-z]+$/.test(name)) throw new Error("not a collection: " + name); return query(name); },
      doc(key) {
        const { coll, id, path } = docPath(key);
        return {
          // the document as GitHub has it now (null if there is none): the worker watches for a Stop this way
          get: async () => { const cur = await readDoc(path); return cur ? cur.data : null; },
          set: (data) => serial(path, () => retry(async () => { const cur = await readDoc(path); const d = clone(data); remember(coll, id, await writeDoc(path, d, cur && cur.sha, `save ${key}`), d); })),
          // the fields given replace those fields; the rest stay as GitHub has them now
          update: (patch) => serial(path, () => retry(async () => {
            const cur = await readDoc(path); if (!cur) { const e = new Error("no such document: " + key); e.code = "not-found"; throw e; }
            const d = { ...cur.data, ...clone(patch) }; remember(coll, id, await writeDoc(path, d, cur.sha, `save ${key} (${Object.keys(patch).join(", ")})`), d);
          })),
          delete: () => serial(path, () => retry(async () => {
            const cur = await readDoc(path); if (cur) await json(`/contents/${path}`, { method: "DELETE", body: { message: `studio: delete ${key}`, sha: cur.sha, branch } });
            remember(coll, id, null, null);
          })),
        };
      },
    };

    // ---- files (recordings, music): one commit per file through the Git Data API, which takes up to 100 MB
    async function commitFile(path, blobSha, message) {
      for (let i = 0; ; i++) {
        try {
          const head = (await json(`/git/ref/heads/${branch}`)).body.object.sha, tree = (await json(`/git/commits/${head}`)).body.tree.sha;
          const t = (await json("/git/trees", { method: "POST", body: { base_tree: tree, tree: [{ path, mode: "100644", type: "blob", sha: blobSha }] } })).body.sha;
          const c = (await json("/git/commits", { method: "POST", body: { message, tree: t, parents: [head] } })).body.sha;
          await json(`/git/refs/heads/${branch}`, { method: "PATCH", body: { sha: c, force: false } }); return;
        } catch (e) {
          // 422: someone pushed meanwhile (on top of theirs), or GitHub does not show the blob or tree it just made yet
          if (e.status !== 422 || i >= 5) throw e;
          await new Promise((r) => setTimeout(r, 400 * (i + 1)));
        }
      }
    }
    const assets = {
      async upload(blob) {
        const id = "f" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        const sha = (await json("/git/blobs", { method: "POST", body: { content: toB64(new Uint8Array(await blob.arrayBuffer())), encoding: "base64" } })).body.sha;
        await commitFile(`db/files/${id}`, sha, `studio: upload ${id}`);
        return { id };
      },
      async delete(id) {
        if (!SAFE.test(String(id))) throw new Error("not a file: " + id);
        const path = `db/files/${id}`;
        let cur; try { cur = (await json(`/contents/${path}${ref}`)).body; } catch (e) { if (e.status === 404) return; throw e; }
        await json(`/contents/${path}`, { method: "DELETE", body: { message: `studio: delete ${id}`, sha: cur.sha, branch } });
      },
    };
    // what the page reads as fetch("/_blob/<id>")
    async function blob(id) {
      if (!SAFE.test(String(id))) return new Response("", { status: 404 });
      const r = await call(`/contents/db/files/${id}${ref}`, { accept: "application/vnd.github.raw" });
      return r.ok ? new Response(await r.blob(), { status: 200 }) : new Response("", { status: r.status });
    }
    // starts a workflow (Approve → youtube.yml); the key needs Actions: Read and write
    const dispatch = async (workflow, inputs) => { if (!/^[a-z0-9-]+\.yml$/.test(workflow)) throw new Error("not a workflow: " + workflow); await json(`/actions/workflows/${workflow}/dispatches`, { method: "POST", body: { ref: branch, inputs } }); };
    return { db, assets, blob, dispatch, refresh, refreshAll, call };
  }

  const api = { makeBackend, toB64, fromB64 };
  if (typeof window === "undefined" || !window.document) { globalThis.DocuGitHub = api; return; }
  window.DocuGitHub = api;
  if (window.claude) return; // opened inside Claude: Claude's own database stays in charge

  // a test server may point the page at a fake GitHub, never a published page (the key would go there)
  const local = /^(127\.0\.0\.1|localhost)$/.test(location.hostname), q = new URLSearchParams(location.search);
  const apiBase = local && q.get("api") ? new URL(q.get("api"), location.href).href.replace(/\/$/, "") : "https://api.github.com";
  let token = null; try { token = localStorage.getItem(KEY); } catch (e) {}

  const panel = (html) => { const show = () => { const d = document.createElement("div"); d.id = "gh-panel"; d.style.cssText = "max-width:720px;margin:12px auto;padding:14px 16px;border:1px solid #c9a227;border-radius:10px;background:#1b1b1b;color:#eee;font:14px system-ui,sans-serif"; d.innerHTML = html; document.body.prepend(d); return d; };
    return document.body ? Promise.resolve(show()) : new Promise((ok) => document.addEventListener("DOMContentLoaded", () => ok(show()))); };
  const signIn = (why) => panel(`<b>Docu Studio on GitHub</b><p style="margin:6px 0">${why || "Paste your GitHub access key to open your projects."} It is kept only in this browser.</p>
<p style="margin:6px 0;color:#aaa;font-size:13px">Make it once: GitHub → Settings → Developer settings → Fine-grained tokens → Generate new token. Repository access: only <b>pnoychess-docu</b>. Permissions: Contents <b>Read and write</b>, Actions <b>Read and write</b>.</p>
<input id="gh-key" type="password" autocomplete="off" placeholder="github_pat_…" style="width:100%;padding:8px;margin:4px 0;box-sizing:border-box"> <button id="gh-save" type="button">Open my projects</button> <span id="gh-msg"></span>`).then((d) => {
    d.querySelector("#gh-save").onclick = async () => {
      const k = d.querySelector("#gh-key").value.trim(), msg = d.querySelector("#gh-msg"); if (!k) return;
      msg.textContent = " Checking…";
      try { const r = await fetch(`${apiBase}/repos/${REPO}`, { headers: { Authorization: "Bearer " + k, Accept: "application/vnd.github+json" } }); const j = r.ok ? await r.json() : null;
        if (!j) throw new Error(r.status === 401 ? "GitHub did not accept this key" : r.status === 404 ? "this key cannot see pnoychess-docu" : "GitHub said " + r.status);
        if (!j.permissions || !j.permissions.push) throw new Error("this key can read but not save (Contents: Read and write)");
        localStorage.setItem(KEY, k); location.reload();
      } catch (e) { msg.textContent = " " + e.message; }
    };
  });

  if (!token) { signIn(); window.claude = { use: () => Promise.reject(new Error("not signed in")) }; return; }
  let warned = false;
  const backend = makeBackend({ fetch: window.fetch.bind(window), token, api: apiBase, onAuthError: () => { if (warned) return; warned = true; try { localStorage.removeItem(KEY); } catch (e) {} signIn("Your GitHub key no longer works (expired or removed). Paste a new one."); } });
  const realFetch = window.fetch.bind(window);
  window.fetch = (input, init) => { const u = typeof input === "string" ? input : input && input.url; const m = /^\/_blob\/([^/?#]+)$/.exec(u || ""); return m ? backend.blob(decodeURIComponent(m[1])) : realFetch(input, init); };
  // <img src="/_blob/…"> never goes through fetch: load it with the key and show it from memory
  const shown = new Map();
  const swap = (img) => {
    const m = /^\/_blob\/([^/?#]+)$/.exec(img.getAttribute("src") || ""); if (!m) return;
    const id = decodeURIComponent(m[1]); img.removeAttribute("src"); img.dataset.blob = id;
    if (!shown.has(id)) shown.set(id, backend.blob(id).then((r) => (r.ok ? r.blob() : Promise.reject(new Error("missing")))).then((b) => URL.createObjectURL(b)).catch((e) => { shown.delete(id); throw e; }));
    shown.get(id).then((u) => { if (img.dataset.blob === id) img.src = u; }, () => { img.alt = (img.alt || "Picture") + " (could not load)"; });
  };
  const scan = (n) => { if (n.nodeType !== 1) return; if (n.matches("img[src^='/_blob/']")) swap(n); n.querySelectorAll("img[src^='/_blob/']").forEach(swap); };
  new MutationObserver((ms) => ms.forEach((m) => (m.type === "attributes" ? scan(m.target) : m.addedNodes.forEach(scan)))).observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ["src"] });
  if (document.body) scan(document.body);

// ---------- script writing with Claude (sample) ----------
// Calls: one for the outline + cold open, then one per chapter (each saved as soon as it is written, so a
// failure resumes from the next chapter). Music is never sent to Claude: it names a mood per chapter and
// the page picks a library track for it.
// moods → library tracks, from the MUSIC list labels ("Title (mood)")
const MOODS = {}; MUSIC.forEach(([id, t]) => { const m = (t.match(/\((\w+)/) || [])[1]; if (m && m !== "code") (MOODS[m] = MOODS[m] || []).push(id); });
const trackFor = (mood, used) => { const l = MOODS[String(mood || "").toLowerCase()] || []; return l.find((x) => !used.includes(x)) || l[0]; };
const errText = (e) => e.code === "not_granted" ? "Claude was not allowed for this page." : e.code === "rate_limited" ? "too many requests, try again in a few minutes." : (e.message || e.code);

async function write(opt) {
  if (!opt.topic) return;
  S.busy = true; $("#go").disabled = true; const prog = $("#prog"); prog.hidden = false; const bar = $("#prog i");
  const set = (k, m) => { bar.style.width = Math.round(k * 100) + "%"; say(m); };
  try {
    const target = opt.minutes * 150;
    set(0.05, "Planning the chapters and the cold open…");
    const outline = await S.sample.json(PROMPTS.outline(opt, target), { modelTier: "complex" });
    if (!outline || !Array.isArray(outline.chapters) || !outline.chapters.length) throw new Error("the outline came back empty");
    const co = (Array.isArray(outline.coldOpen) ? outline.coldOpen : []).filter((s) => s && s.text);
    const scenes = co.length ? co.map((s, k) => ({ id: "open" + (k + 1), text: String(s.text), visual: s.visual && s.visual.type ? s.visual : { type: "title", title: outline.title } }))
      : [{ id: "title", text: "", visual: { type: "title", title: outline.title, subtitle: "A PnoyChess story" } }];
    const id = slugify(outline.title) + "-" + Date.now().toString(36).slice(-4);
    const p = { id, title: outline.title, topic: opt.topic, minutes: opt.minutes, status: "writing", factsChecked: false, claimsRequired: true, sources: outline.sources || [], createdAt: new Date().toISOString(),
      titles: [outline.title, ...((outline.titles || []).filter((t) => t && t !== outline.title).slice(0, 3))],
      outline: { chapters: outline.chapters.map((c) => ({ title: String(c.title || ""), words: +c.words || 0, mood: c.mood || "", beats: c.beats || [], opens: String(c.opens || "") })), target,
        question: String(outline.question || ""), format: opt.format || "story" },
      writing: { next: 0 },
      plan: { title: outline.title, format: "16:9", music: { track: opt.music }, next: outline.next || "", coldOpen: scenes.length, scenes,
        thumbnail: { text: (outline.thumbnail && outline.thumbnail.text) || outline.title.split(" ").slice(0, 4).join(" "), small: outline.thumbnail && outline.thumbnail.small || "", person: outline.thumbnail && outline.thumbnail.person || "", people: [] } } };
    await S.db.doc("projects/" + id).set({ ...p, updatedAt: new Date().toISOString() });
    S.cur = p;
    await writeChapters(p, set);
  } catch (e) { say("Writing stopped: " + errText(e) + (S.cur && S.cur.status === "writing" ? " Press Continue writing to go on." : "")); }
  finally { S.busy = false; const g = $("#go"); if (g) g.disabled = false; else render(); }
}

// the scenes of chapter i (0-based): from its first scene (which carries `chapter`) to the next chapter
function chapterRange(p, i) {
  const starts = p.plan.scenes.map((s, k) => (s.chapter ? k : -1)).filter((k) => k >= 0);
  return starts[i] == null ? null : [starts[i], starts[i + 1] == null ? p.plan.scenes.length : starts[i + 1]];
}
const chapterList = (p) => p.outline && p.outline.chapters && p.outline.chapters.length ? p.outline.chapters
  : p.plan.scenes.filter((s) => s.chapter).map((s) => ({ title: s.chapter, words: 0, mood: "", beats: [] }));

// one chapter from Claude → scenes (ids c<n>s<k>; the first one carries the chapter title and, from its mood, the music)
async function chapterScenes(p, i, opt = {}) {
  const chs = chapterList(p), ch = chs[i], last = i === chs.length - 1;
  const before = chapterRange(p, i - 1), prevText = i === 0 ? p.plan.scenes.slice(0, p.plan.coldOpen || 0).map((s) => s.text).join(" ")
    : before ? p.plan.scenes.slice(before[0], before[1]).map((s) => s.text).join(" ") : "";
  const words = ch.words || Math.round((p.outline && p.outline.target || p.minutes * 150) / chs.length);
  const sc = await S.sample.json(PROMPTS.chapter({ p, chs, ch, i, words, prevText, opt, last }), { modelTier: "complex" });
  if (!Array.isArray(sc) || !sc.length) throw new Error("chapter " + (i + 1) + " came back empty");
  // music: the chapter's mood picks a track not used by the chapters before it
  const used = p.plan.scenes.slice(0, before ? before[1] : 0).map((s) => s.music).filter(Boolean);
  const track = ch.mood ? trackFor(ch.mood, used) : null;
  return sc.map((s, k) => ({ id: `c${i + 1}s${k + 1}`, ...(k === 0 ? { chapter: ch.title, ...(track ? { music: track } : {}) } : {}), text: String(s.text || ""),
    visual: s.visual && s.visual.type ? s.visual : { type: "title", title: ch.title }, ...(s.lowerThird && s.lowerThird.name ? { lowerThird: s.lowerThird } : {}), ...(s.take ? { take: true } : {}) }));
}
// thumbnail people: photos of the video's main person first (plan.thumbnail.person), then people introduced with a photo
function peopleFor(scenes, person) {
  const last = String(person || "").trim().split(/\s+/).pop().toLowerCase(), photos = scenes.filter((x) => x.visual && x.visual.type === "photo");
  const main = last ? photos.filter((x) => [x.visual.search, x.visual.label, x.lowerThird && x.lowerThird.name].join(" ").toLowerCase().includes(last)) : [];
  return [...new Set([...main.slice(0, 1), ...photos.filter((x) => x.lowerThird), ...main.slice(1)].map((x) => x.id))].slice(0, 2);
}

// writes chapters from p.writing.next on, saving after each one
async function writeChapters(p, set = (k, m) => say(m)) {
  const chs = chapterList(p);
  for (let i = (p.writing && p.writing.next) || 0; i < chs.length; i++) {
    set(0.1 + 0.85 * (i / chs.length), `Writing chapter ${i + 1} of ${chs.length}: ${chs[i].title}…`);
    const sc = await chapterScenes(p, i);
    p.plan.scenes = [...p.plan.scenes.filter((s) => !s.id.startsWith(`c${i + 1}s`)), ...sc];
    p.plan.thumbnail.people = peopleFor(p.plan.scenes, p.plan.thumbnail.person);
    await save(p, { plan: p.plan, writing: { next: i + 1 } });
  }
  await save(p, { status: "draft", writing: null });
  // the original score plan comes with every new script (Music section: edit it, or pick library music instead)
  if (S.sample && !(p.plan.score || []).length) {
    set(0.97, "Composing the score plan…");
    try { const { theme, score } = await scoreBriefs(p); p.plan.scoreTheme = theme; p.plan.score = score; useScoreEverywhere(p); await save(p, { plan: p.plan }); }
    catch (e) { /* the script is saved; the score plan can be written later from the Music section */ }

  if (S.sample) { set(0.99, "Listing the facts to check…"); try { await listClaims(p); } catch (e) { /* List the claims in Check the facts tries again */ } }
  set(1, "Script ready, with an original score plan. Read it through, check the facts, then record your narration.");
  S.view = "write"; render();
}

// ---------- the fact gate ----------
// Only the scenes not listed yet go to Claude; claims on unchanged scenes keep Mark's decisions. Every new claim
// starts open whatever Claude says about it, and a source outside the script's list is dropped (it may be invented).
// A changed scene may have nothing to check (an opinion, new thumbnail words): that is accepted and named, so Mark
// reads it himself; only a first listing that finds no fact at all is an error.
async function listClaims(p) {
  const ids = new Set(factGate(p).changed), said = factScenes(p).filter(factText), todo = said.filter((s) => ids.has(s.id));
  const factScan = Object.fromEntries(said.map((s) => [s.id, factKey(s)]));
  const got = await S.sample.json(PROMPTS.claims(p, todo), { modelTier: "complex" });
  const kept = Array.isArray(got) ? got.filter((c) => c && ids.has(c.scene) && String(c.text || "").trim()) : null;
  if (!kept || (todo.length && !kept.length && !Object.keys(p.factScan || {}).length)) throw new Error("the claims came back empty");
  const urls = (p.sources || []).map((s) => s.url), stamp = Date.now().toString(36);

  await save(p, { claims: [...(p.claims || []).filter((c) => factScan[c.scene] && !ids.has(c.scene)), ...fresh], factScan });

// ---------- Music tab: your own library of original tracks (Eleven Music), made once, reused in every video ----------
// every original track you can pick in a project: library requests that are ready + the chapter scores of past videos
function originals() {
  const out = [], seen = new Set(), add = (id, title, mood, seconds, from) => { if (id && !seen.has(id)) { seen.add(id); out.push({ id, title, mood, seconds, from }); } };
  S.music.filter((t) => t.status === "ready" && t.libId).forEach((t) => add(t.libId, t.title, t.mood, t.seconds, "library"));
  S.projects.forEach((p) => ((p.result && p.result.scoreCues) || []).forEach((c) => add(c.id, c.title, c.mood, c.seconds, p.title)));
  return out;
}

    el("div", { class: "grid2" }, el("label", {}, "Name", title), el("div", { class: "grid2" }, el("label", {}, "Mood", mood), el("label", {}, "Length", len))),

      el("button", { class: "btn", type: "button", disabled: !S.sample || S.busy, text: S.busy ? "Writing…" : "Let Claude write the brief", onclick: async () => {
        S.busy = true; say("Writing the brief…");

          brief.value = String(r.text || "").trim(); say("Brief written. Edit it if you like, then press Make it."); }
        catch (e) { say("Could not write the brief: " + errText(e)); } finally { S.busy = false; } } }),

      el("div", { class: "row" }, el("span", { class: "pill " + cls, text: label }),
